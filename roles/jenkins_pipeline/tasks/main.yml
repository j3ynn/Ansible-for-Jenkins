---

- name: genera Jenkinsfile node exporter
  ansible.builtin.template:
    src: node_exporter.j2
    dest: "./Jenkinsfile-node"
  loop: "{{ pipelines }}"
  when: genera_metriche | default(true) | bool

- name: genera Jenkinsfile cluster rabbitmq
  ansible.builtin.template:
    src: cluster-RabbitMQ.j2
    dest: "./Jenkinsfile-rabbit"
  loop: "{{ pipelines2 }}"
  when: genera_rabbitmq | default(true) | bool

