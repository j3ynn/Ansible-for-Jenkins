apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      containers:
        - name: jenkins
          image: jenkins/jenkins:lts
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: jenkinsfiles
              mountPath: /var/jenkinsfiles
      volumes:
        - name: jenkinsfiles
          configMap:
            name: jenkinsfiles-generati

---

apiVersion: v1
kind: Service
metadata:
  name: jenkins
  namespace: output
spec:
  selector:
    app: jenkins
  ports:
    - port: 8080
      targetPort: 8080